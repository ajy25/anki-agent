<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Anki Agent for Mac. Watch the demo and download the app.">
  <title>Anki Agent</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=minimal">

<body>

  <main id="main">
    <section id="demo" aria-label="Demo">
      <video controls playsinline preload="metadata" poster="demo-poster.webp?v=citations" aria-label="Anki Agent app walkthrough">

        <track kind="captions" src="demo.vtt?v=citations" srclang="en" label="Walkthrough captions" default>
        <a href="demo.mp4?v=citations">Download the demo video</a>.
      </video>
    </section>
    <section id="download" aria-label="Download">
      <a class="download-link" href="__DOWNLOAD_URL__">__DOWNLOAD_LABEL__</a>
    </section>
  </main>

  <footer aria-label="Project links">
    <a href="https://github.com/ajy25/anki-agent/blob/main/docs/MAC_SETUP.md">Setup guide</a>
    <a href="https://github.com/ajy25/anki-agent/blob/main/CHANGELOG.md">Changelog</a>
    <a href="https://github.com/ajy25/anki-agent">GitHub</a>
  </footer>

</html>
